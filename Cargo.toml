[package]
name = "seer"
description = "interactive TUI for exploring Oxide system logs"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"

[features]
# Marker used by `required-features` on the `engine` benchmark so it
# is only built when the caller opts in.  The benchmark exercises
# large fixture builds; the feature guards it from
# `cargo check --all-targets` runs that would otherwise compile it
# every time.  `seer::test_fixtures` itself is unconditionally
# public.
test-fixtures = []

#
# Tree-wide lint configuration, copied from Omicron.
# https://doc.rust-lang.org/stable/cargo/reference/manifest.html#the-lints-section
#
# For a list of Clippy lints, see
# https://rust-lang.github.io/rust-clippy/master.
#
[lints.clippy]
# Clippy's style nits are useful, but not worth keeping in CI.
style = { level = "allow", priority = -1 }
# Warn on anything in the "disallowed_" namespace.
disallowed_macros = "warn"
disallowed_methods = "warn"
disallowed_names = "warn"
disallowed_script_idents = "warn"
disallowed_types = "warn"
# Warn on some more style lints that are relatively stable and make sense.
iter_cloned_collect = "warn"
iter_next_slice = "warn"
iter_nth = "warn"
iter_nth_zero = "warn"
iter_skip_next = "warn"
len_zero = "warn"
redundant_field_names = "warn"
# `declare_interior_mutable_const` is classified as a style lint, but it can
# identify real bugs (e.g., declarying a `const Atomic` and using it like
# a `static Atomic`). However, it is also subject to false positives (e.g.,
# idiomatically declaring a static array of atomics uses `const Atomic`). We
# warn on this to catch the former, and expect any uses of the latter to allow
# this locally.
declare_interior_mutable_const = "warn"
# Also warn on casts, preferring explicit conversions instead.
#
# We'd like to warn on lossy casts in the future, but lossless casts are the
# easiest ones to convert over.
cast_lossless = "warn"

[dependencies]
base62 = { version = "2.2.4", features = ["std"] }
camino = { version = "1.2.1", features = ["serde1"] }
camino-tempfile = "1.4.1"
chrono = { version = "0.4.42", default-features = false, features = ["serde", "std", "clock"] }
clap = { version = "4.6.1", features = ["derive"] }
derive_more = { version = "2.0.1", features = ["as_ref", "display", "from"] }
etcetera = "0.11.0"
getrandom = "0.4.2"
iddqd = { version = "0.3.13", features = ["serde", "schemars08"] }
ratatui = "0.30.0"
regex = "1.11.3"
schemars = { version = "0.8.22", features = ["chrono", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shlex = "1.3.0"
thiserror = "2.0.18"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
expectorate = "1.2.0"
proptest = "1.6.0"
slog = "2.7.0"
slog-bunyan = "2.5.0"
strum = { version = "0.27", features = ["derive"] }

[[bench]]
name = "engine"
path = "benches/engine.rs"
harness = false
required-features = ["test-fixtures"]
